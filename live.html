<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Stream - Champions Esports</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Rajdhani',sans-serif;
background:#02030d;
color:white;
overflow-x:hidden;
}

/* SCROLLBAR */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-track{
background:#02030d;
}

::-webkit-scrollbar-thumb{
background:linear-gradient(#00ffae,#0088ff);
border-radius:10px;
}

/* BACKGROUND */

.bg{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
z-index:-5;
background:
linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.95)),
url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop');
background-size:cover;
background-position:center;
}

.bg::before{
content:'';
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at top left, rgba(0,255,170,.18), transparent 30%),
radial-gradient(circle at bottom right, rgba(0,120,255,.16), transparent 30%);
}

/* FLOATING LIGHTS */

.light{
position:absolute;
border-radius:50%;
filter:blur(120px);
opacity:.15;
animation:float 8s infinite alternate;
}

.light1{
width:350px;
height:350px;
background:#00ffae;
top:-100px;
left:-100px;
}

.light2{
width:400px;
height:400px;
background:#0088ff;
bottom:-120px;
right:-120px;
animation-delay:2s;
}

@keyframes float{
0%{
transform:translate(0,0);
}
100%{
transform:translate(60px,60px);
}
}

/* NAVBAR */

nav{
width:100%;
padding:18px 6%;
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
top:0;
z-index:9999;
background:rgba(2,3,13,.7);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.06);
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo-box{
width:58px;
height:58px;
border-radius:18px;
background:linear-gradient(135deg,#00ffae,#00aaff);
display:flex;
justify-content:center;
align-items:center;
font-family:'Orbitron',sans-serif;
font-size:1.2rem;
font-weight:900;
color:black;
box-shadow:0 0 35px rgba(0,255,170,.4);
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
0%{transform:scale(1);}
100%{transform:scale(1.08);}
}

.logo-text{
font-family:'Orbitron',sans-serif;
font-size:1.8rem;
font-weight:900;
background:linear-gradient(90deg,#00ffae,#00aaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:2px;
}

nav ul{
display:flex;
gap:35px;
list-style:none;
}

nav ul li a{
text-decoration:none;
color:rgba(255,255,255,.8);
font-size:1.15rem;
font-weight:600;
transition:.3s;
position:relative;
}

nav ul li a:hover{
color:#00ffae;
}

nav ul li a::after{
content:'';
position:absolute;
left:0;
bottom:-6px;
width:0%;
height:2px;
background:#00ffae;
transition:.3s;
}

nav ul li a:hover::after{
width:100%;
}

/* MAIN CONTENT */

.main-content{
padding:160px 6% 80px;
}

.section-title{
margin-bottom:30px;
text-align:center;
}

.section-title h1{
font-size:3.5rem;
font-family:'Orbitron',sans-serif;
background:linear-gradient(90deg,#00ffae,#00aaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:2px;
margin-bottom:10px;
filter:drop-shadow(0 0 20px rgba(0,255,170,.2));
}

.live-badge{
display:inline-block;
background:red;
color:white;
padding:6px 16px;
border-radius:20px;
font-weight:700;
font-size:.9rem;
margin-bottom:15px;
animation:blink 1.5s infinite;
}

@keyframes blink{
0%, 100%{ opacity: 1; }
50%{ opacity: 0.4; }
}

/* STREAM CONTAINER */

.stream-card{
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
border-radius:35px;
padding:25px;
backdrop-filter:blur(16px);
box-shadow:0 0 45px rgba(0,255,170,.08);
max-width:1000px;
margin:0 auto;
transition:.35s;
}

.stream-card:hover{
border-color:rgba(0,255,170,.3);
box-shadow:0 0 55px rgba(0,255,170,.15);
}

.video-container{
position:relative;
padding-bottom:56.25%;
height:0;
overflow:hidden;
border-radius:22px;
background:black;
}

.video-container iframe{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
border:none;
}

.stream-info{
margin-top:25px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
}

.stream-info h2{
font-family:'Orbitron',sans-serif;
font-size:1.8rem;
color:#00ffae;
}

.stream-info p{
color:rgba(255,255,255,.7);
font-size:1.1rem;
}

footer{
padding:50px 6%;
text-align:center;
color:rgba(255,255,255,.6);
font-size:1.1rem;
border-top:1px solid rgba(255,255,255,.05);
background:rgba(2,3,13,.8);
margin-top:60px;
}

@media(max-width:950px){

nav ul{
display:none;
}

.section-title h1{
font-size:2.5rem;
}

.logo-text{
font-size:1.3rem;
}

}

</style>

</head>

<body>

<div class="bg">

<div class="light light1"></div>
<div class="light light2"></div>

</div>

<nav>

<div class="logo">

<div class="logo-box">
CE
</div>

<div class="logo-text">
CHAMPIONS ESPORTS
</div>

</div>

<ul>

</ul>

</nav>

<div class="main-content">

<div class="section-title">
<span class="live-badge">🔴 LIVE NOW</span>
<h1>TOURNAMENT LIVESTREAM</h1>
<p>Watch official matches and championship finals live.</p>
</div>

<div class="stream-card">

<div class="video-container">
<iframe src="https://www.youtube.com/embed/live_stream?channel=YOUR_CHANNEL_ID" allowfullscreen></iframe>
</div>

<div class="stream-info">
<div>
<h2>eFootball Mobile Cup — Final Stage</h2>
<p>32 Players Competition • Official Stream</p>
</div>
</div>

</div>

</div>

<footer>
© 2026 Champions Esports — Built For Legends.
</footer>
