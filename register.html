<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Champions Esports</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#050816;
color:white;
overflow-y:auto;
min-height:100vh;
}

/* BACKGROUND */

.background{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:
linear-gradient(rgba(0,0,0,.84),rgba(0,0,0,.92)),
url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop');
background-size:cover;
background-position:center;
z-index:-5;
}

.background::before{
content:'';
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at top left, rgba(0,255,170,.15), transparent 30%),
radial-gradient(circle at bottom right, rgba(0,140,255,.15), transparent 30%);
}

/* CONTAINER */

.container{
width:100%;
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
padding:120px 18px 70px;
}

/* CARD */

.card{
width:100%;
max-width:540px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(16px);
padding:45px;
border-radius:30px;
box-shadow:0 0 40px rgba(0,255,170,.08);
animation:fadeUp 1s ease;
}

.logo{
text-align:center;
font-size:2.3rem;
font-family:'Orbitron',sans-serif;
font-weight:900;
margin-bottom:12px;
background:linear-gradient(90deg,#00ffae,#00aaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
text-align:center;
color:rgba(255,255,255,.7);
margin-bottom:38px;
line-height:1.8;
font-size:.98rem;
}

/* INPUTS */

.input-group{
margin-bottom:22px;
}

.input-group label{
display:block;
margin-bottom:10px;
font-size:.95rem;
color:rgba(255,255,255,.88);
font-weight:500;
}

.input-group input,
.input-group select{
width:100%;
padding:17px 18px;
border-radius:16px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.05);
color:white;
font-size:1rem;
outline:none;
transition:.3s;
}

.input-group input:focus,
.input-group select:focus{
border-color:#00ffae;
box-shadow:0 0 20px rgba(0,255,170,.2);
}

.input-group input::placeholder{
color:rgba(255,255,255,.45);
}

/* BUTTON */

.btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#00ffae,#00aaff);
font-size:1rem;
font-weight:700;
cursor:pointer;
transition:.35s;
margin-top:15px;
color:black;
}

.btn:hover{
transform:translateY(-4px);
box-shadow:0 0 35px rgba(0,255,170,.45);
}

/* LOGIN */

.login-link{
text-align:center;
margin-top:28px;
color:rgba(255,255,255,.7);
line-height:1.7;
}

.login-link a{
color:#00ffae;
text-decoration:none;
font-weight:700;
}

/* MESSAGE */

.message{
margin-top:20px;
text-align:center;
font-size:.95rem;
}

/* ANIMATION */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:600px){

.container{
padding:140px 14px 80px;
}

.card{
padding:34px 22px;
border-radius:24px;
}

.logo{
font-size:1.7rem;
}

}

</style>

</head>

<body>

<div class="background"></div>

<div class="container">

<div class="card">

<div class="logo">
CHAMPIONS ESPORTS
</div>

<div class="subtitle">
Create your account and join the next generation of esports tournaments.
Compete, rank up and become legendary.
</div>

<form id="registerForm">

<div class="input-group">
<label>Username</label>
<input type="text" id="username" placeholder="Enter username" required>
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" placeholder="Enter email" required>
</div>

<div class="input-group">
<label>Instagram Username</label>
<input type="text" id="instagram" placeholder="@yourinstagram" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" placeholder="Enter password" required>
</div>

<div class="input-group">
<label>Select Game</label>

<select id="game" required>
<option>eFootball Mobile</option>
<option>Free Fire</option>
<option>PUBG Mobile</option>
<option>League Of Legends</option>
<option>Valorant</option>
<option>FC Mobile</option>
</select>

</div>

<div class="input-group">
<label>Game ID</label>
<input type="text" id="gameid" placeholder="Enter your Game ID" required>
</div>

<button class="btn" type="submit">
CREATE ACCOUNT
</button>

</form>

<div class="message" id="message"></div>

<div class="login-link">
Already have an account?<br>
<a href="login.html">Login Here</a>
</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCsoPTD_3CdK19CEiHHjxDEHfx_9YIfsbU",

authDomain: "champions-esports-league.firebaseapp.com",

projectId: "champions-esports-league",

storageBucket: "champions-esports-league.firebasestorage.app",

messagingSenderId: "618814749744",

appId: "1:618814749744:web:308bbc15b4862b02f381f5",

measurementId: "G-KRSG32J9J9"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const form = document.getElementById("registerForm");

const message = document.getElementById("message");

form.addEventListener("submit", async (e)=>{

e.preventDefault();

const username =
document.getElementById("username").value;

const email =
document.getElementById("email").value;

const instagram =
document.getElementById("instagram").value;

const password =
document.getElementById("password").value;

const game =
document.getElementById("game").value;

const gameid =
document.getElementById("gameid").value;

try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

const user = userCredential.user;

await setDoc(doc(db,"users",user.uid),{

username: username,

email: email,

instagram: instagram,

game: game,

gameid: gameid,

wins: 0,

points: 0,

createdAt: new Date()

});

message.style.color = "#00ffae";

message.innerHTML =
"Account Created Successfully 🔥";

setTimeout(()=>{

window.location.href = "login.html";

},2000);

}catch(error){

message.style.color = "#ff4d4d";

message.innerHTML = error.message;

}

});

</script>

</body>
</html>
