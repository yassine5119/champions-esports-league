<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Champions Esports</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#050816;
color:white;
overflow:hidden;
}

/* BACKGROUND */

.background{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:
linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.92)),
url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop');
background-size:cover;
background-position:center;
z-index:-5;
}

.background::before{
content:'';
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at top left, rgba(0,255,170,.15), transparent 30%),
radial-gradient(circle at bottom right, rgba(0,140,255,.15), transparent 30%);
}

/* CONTAINER */

.container{
width:100%;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px 20px;
}

/* CARD */

.card{
width:100%;
max-width:500px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(14px);
padding:45px;
border-radius:30px;
box-shadow:0 0 40px rgba(0,255,170,.08);
animation:fadeUp 1s ease;
}

.logo{
text-align:center;
font-size:2.2rem;
font-family:'Orbitron',sans-serif;
font-weight:900;
margin-bottom:10px;
background:linear-gradient(90deg,#00ffae,#00aaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
text-align:center;
color:rgba(255,255,255,.7);
margin-bottom:35px;
line-height:1.7;
}

/* INPUTS */

.input-group{
margin-bottom:22px;
}

.input-group label{
display:block;
margin-bottom:10px;
font-size:.95rem;
color:rgba(255,255,255,.85);
}

.input-group input{
width:100%;
padding:17px 18px;
border-radius:16px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.05);
color:white;
font-size:1rem;
outline:none;
transition:.3s;
}

.input-group input:focus{
border-color:#00ffae;
box-shadow:0 0 20px rgba(0,255,170,.2);
}

/* BUTTON */

.btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#00ffae,#00aaff);
font-size:1rem;
font-weight:700;
cursor:pointer;
transition:.35s;
margin-top:10px;
}

.btn:hover{
transform:translateY(-4px);
box-shadow:0 0 35px rgba(0,255,170,.45);
}

/* REGISTER */

.register-link{
text-align:center;
margin-top:25px;
color:rgba(255,255,255,.7);
}

.register-link a{
color:#00ffae;
text-decoration:none;
font-weight:600;
}

/* ANIMATION */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* MOBILE */

@media(max-width:600px){

.card{
padding:35px 25px;
}

.logo{
font-size:1.7rem;
}

}

</style>

</head>

<body>

<div class="background"></div>

<div class="container">

<div class="card">

<div class="logo">
CHAMPIONS ESPORTS
</div>

<div class="subtitle">
Login to your account and access tournaments, rankings and esports battles.
</div>

<form action="dashboard.html">

<div class="input-group">
<label>Email</label>
<input type="email" placeholder="Enter email" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" placeholder="Enter password" required>
</div>

<button class="btn">
LOGIN
</button>

</form>

<div class="register-link">
Don't have an account?
<a href="register.html">Create Account</a>
</div>

</div>

</div>

</body>
</html>
