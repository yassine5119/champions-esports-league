<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Champions Esports</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Poppins',sans-serif;
background:#050816;
overflow-x:hidden;
color:white;
}

/* SCROLLBAR */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-track{
background:#050816;
}

::-webkit-scrollbar-thumb{
background:linear-gradient(#00ffae,#0088ff);
border-radius:10px;
}

/* BACKGROUND */

.background{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:
linear-gradient(rgba(0,0,0,.86),rgba(0,0,0,.94)),
url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop');
background-size:cover;
background-position:center;
z-index:-5;
}

.glow{
position:absolute;
width:400px;
height:400px;
background:#00ffae;
filter:blur(160px);
opacity:.12;
border-radius:50%;
top:-100px;
left:-100px;
animation:float 8s infinite alternate;
}

.glow2{
position:absolute;
width:400px;
height:400px;
background:#0088ff;
filter:blur(160px);
opacity:.12;
border-radius:50%;
bottom:-100px;
right:-100px;
animation-delay:2s;
}

@keyframes float{
0%{transform:translate(0,0);}
100%{transform:translate(60px,60px);}
}

/* CONTAINER */

.container{
width:100%;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px 18px;
}

/* CARD */

.card{
width:100%;
max-width:480px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(16px);
padding:45px;
border-radius:32px;
box-shadow:0 0 45px rgba(0,255,170,.08);
animation:fadeUp 1s ease;
transition:.35s;
}

.card:hover{
border-color:rgba(0,255,170,.3);
box-shadow:0 0 55px rgba(0,255,170,.15);
}

/* TITLE */

.logo{
text-align:center;
font-size:2.2rem;
font-family:'Orbitron',sans-serif;
font-weight:900;
margin-bottom:10px;
background:linear-gradient(90deg,#00ffae,#00aaff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 15px rgba(0,255,170,.2));
}

.subtitle{
text-align:center;
color:rgba(255,255,255,.75);
margin-bottom:35px;
line-height:1.6;
font-size:1rem;
}

/* INPUTS */

.input-group{
margin-bottom:24px;
}

.input-group label{
display:block;
margin-bottom:10px;
font-size:.95rem;
font-weight:500;
color:rgba(255,255,255,.88);
}

.input-group input{
width:100%;
padding:18px;
border-radius:18px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.05);
color:white;
font-size:1rem;
outline:none;
transition:.3s;
}

.input-group input:focus{
border-color:#00ffae;
background:rgba(255,255,255,.08);
box-shadow:0 0 25px rgba(0,255,170,.25);
}

/* BUTTON */

.btn{
width:100%;
padding:19px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#00ffae,#00aaff);
font-size:1.05rem;
font-weight:700;
cursor:pointer;
transition:.35s;
color:black;
margin-top:10px;
box-shadow:0 0 30px rgba(0,255,170,.3);
}

.btn:hover{
transform:translateY(-4px);
box-shadow:0 0 45px rgba(0,255,170,.6);
}

/* ERROR MESSAGE */

.error-msg{
margin-top:20px;
padding:14px;
border-radius:14px;
background:rgba(255,0,85,.1);
border:1px solid rgba(255,0,85,.3);
color:#ff0055;
text-align:center;
font-size:.95rem;
display:none;
}

/* ANIMATION */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:600px){

.card{
padding:34px 22px;
border-radius:24px;
}

.logo{
font-size:1.8rem;
}

}

</style>

</head>

<body>

<div class="background">
<div class="glow"></div>
<div class="glow2"></div>
</div>

<div class="container">

<div class="card">

<div class="logo">
LOGIN
</div>

<div class="subtitle">
Enter your credentials to access Champions Esports Dashboard.
</div>

<form id="loginForm">

<div class="input-group">
<label>Email Address</label>
<input type="email"
id="email"
placeholder="yourgmail@gmail.com"
required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password"
id="password"
placeholder="••••••••"
required>
</div>

<button class="btn" type="submit">
LOG IN
</button>

<div class="error-msg" id="errorBox"></div>

</form>

</div>

</div>

<!-- FIREBASE AUTH -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyCsoPTD_3CdK19CEiHHjxDEHfx_9YIfsbU",

authDomain: "champions-esports-league.firebaseapp.com",

projectId: "champions-esports-league",

storageBucket: "champions-esports-league.firebasestorage.app",

messagingSenderId: "618814749744",

appId: "1:618814749744:web:308bbc15b4862b02f381f5",

measurementId: "G-KRSG32J9J9"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const form = document.getElementById("loginForm");

const errorBox = document.getElementById("errorBox");

form.addEventListener("submit", async(e)=>{

e.preventDefault();

const email = document.getElementById("email").value;

const password = document.getElementById("password").value;

try{

await signInWithEmailAndPassword(auth, email, password);

window.location.href = "dashboard.html";

}catch(error){

errorBox.style.display = "block";

errorBox.innerText = error.message;

}

});

</script>

</body>
</html>
